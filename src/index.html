<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image to PDF</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Resimden PDF</h1>
      <p class="subtitle">Birden fazla resmi seçin, tek bir PDF dosyasına dönüştürün.</p>

      <div class="actions">
        <button id="select-btn" class="primary">Resimleri Seç</button>
        <button id="convert-btn" class="primary" disabled>PDF Oluştur</button>
        <button id="clear-btn" class="secondary" disabled>Temizle</button>
      </div>

      <div id="status" class="status"></div>

      <div id="preview" class="preview">
        <p class="empty">Henüz resim seçilmedi</p>
      </div>
    </main>
  </body>
</html>
